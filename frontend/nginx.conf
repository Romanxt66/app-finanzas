# El nombre "alvea-api" es el servicio del backend en docker-compose.yml
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Una sola app: si APP_REDIRECT_URL tiene valor (p. ej. https://app.midominio.com), las páginas de
    # esta versión React redirigen (301) a la app Flutter conservando la ruta. Vacío = sin redirección.
    set $app_redirect "${APP_REDIRECT_URL}";
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: mismo origen, sin CORS. Docker resuelve el nombre al arrancar cada petición.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://alvea-api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # El service worker y el manifest no deben quedar en caché del navegador
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header en este bloque anula los del servidor: se repiten los esenciales
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        if ($app_redirect) {
            return 301 $app_redirect$request_uri;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
