# Despliegue (Coolify) — Alvea: backend FastAPI + frontend React servido por nginx.
# La base de datos NO está aquí: es el Postgres existente. Las variables llegan del entorno
# (en Coolify: variables de entorno secretas del recurso). Nada de credenciales en el repositorio.
# DATABASE_URL y SECRET_KEY van con `:-` (no `:?`): Coolify solo pasa al `docker compose build` las variables
# marcadas «build-time», y esas dos son secretas (solo runtime). Si faltan, el backend no arranca
# (settings exige database_url y secret_key de 32+ caracteres), así que el fallo sigue siendo explícito.
#
# Nombres de servicio únicos (alvea-*): la red "coolify" es compartida con otras apps y los
# nombres de servicio se publican como alias DNS en ella.
services:
  alvea-api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: production
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ORIGINS: '[]'
      # Opcional: errores del servidor y de la app a Sentry (vacío = desactivado)
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - default
      - coolify # alcanzar el Postgres (master-db-central)
    expose:
      - '8000'

  alvea-web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Una sola app: URL de la app Flutter (alvea2) a la que redirigir esta versión. Vacío = no redirige.
      APP_REDIRECT_URL: ${APP_REDIRECT_URL:-}
    depends_on:
      alvea-api:
        condition: service_healthy
    networks:
      - default
    expose:
      - '80'

networks:
  coolify:
    external: true
