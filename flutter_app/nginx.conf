# Plantilla de nginx (la imagen sustituye ${API_UPSTREAM}; las demás $variables son de nginx).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Tipos MIME: main.dart.mjs (compilación WebAssembly) debe servirse como JavaScript
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # Cabeceras de seguridad comunes: en nginx un add_header dentro de un location anula los del
    # servidor, así que cada bloque que añade las suyas vuelve a incluir este archivo.
    include /etc/nginx/snippets/security-headers.conf;

    # Archivos ya comprimidos en la compilación (gzip -9, más pequeños que la compresión al vuelo)
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: mismo origen, sin CORS. Docker resuelve el nombre al arrancar cada petición.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream ${API_UPSTREAM};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Archivos que enlazan al resto de la compilación: nunca en caché, para que un despliegue
    # nuevo se vea al recargar. add_header en un bloque anula los del servidor: se repiten.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Recursos que no cambian entre despliegues (motor CanvasKit y fuentes): caché larga.
    # Si se sube la versión de Flutter, CanvasKit puede tardar hasta 7 días en renovarse.
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~ ^/assets/(assets/fonts|fonts|packages)/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
