<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Alvea (Flutter): finanzas personales">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alvea">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Alvea</title>
  <link rel="manifest" href="manifest.json">
  <!-- Descarga el motor en paralelo con el arranque de Flutter (pesa ~3 MB) -->
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin>
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    html, body { margin: 0; height: 100%; background: #f6f4ff; }
    @media (prefers-color-scheme: dark) { html, body { background: #0b0a14; } }
    /* Indicador de carga: queda detrás de Flutter, que lo tapa al pintar su primer fotograma */
    #boot { position: fixed; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; }
    #boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(124, 92, 255, .25);
      border-top-color: #7c5cff; animation: boot-spin .8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Cargando"><i></i></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
